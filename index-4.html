<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moji Cleaning and Supply Services</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8fd;--card:#fff;--ink:#14263f;--mut:#5a6b82;--blue:#0b2545;--gold:#10b981;--line:#d5e0ef;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1828;--card:#15243a;--ink:#eaf1fb;--mut:#9db0c9;--blue:#5b9bf0;--line:#27395a;--on:#0d1828}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.15}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--blue);color:#fff}
header img{width:52px;height:52px;border-radius:12px;object-fit:cover}
header h1{font-size:22px}header p{margin:0;font-size:13px;opacity:.9}
nav{display:flex;gap:4px;padding:8px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{flex:1;min-width:84px;border:0;background:none;color:var(--mut);font:600 15px Nunito,sans-serif;padding:10px 6px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--gold);color:#04281c}.hero{background:linear-gradient(135deg,#0b2545,#0f5b4a);color:#fff;border-radius:16px;padding:20px;margin-bottom:14px}.hero p{margin:8px 0 0;opacity:.92}.hero .btn{background:#10b981;color:#04281c}.hero .btn.ghost{background:transparent;border:2px solid #fff;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{display:block;width:100%;margin-top:16px;padding:13px;border:0;border-radius:12px;background:var(--blue);color:var(--on);font:700 17px 'Baloo 2',sans-serif;cursor:pointer}
.btn.s{display:inline-block;width:auto;margin:0;padding:6px 12px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--gold);color:#14263f;font-size:12px;font-weight:700}
.q{display:flex;align-items:center;gap:8px}.q button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.note{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--mut);margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column}.stat b{font:700 34px 'Baloo 2',sans-serif;color:#0f9d8a}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;display:none}
</style></head><body>

function load(){try{return JSON.parse(localStorage.getItem("moji")||"[]")}catch(e){return[]}}

function unlock(){if(document.getElementById("pin").value==cf("pin")){unlocked=true;draw()}else toast("Wrong PIN")}

var busy=false,ready=false;

function homeHtml(){var ph=cf("phone")||cf("wa");return '<div class="hero"><h2>Spotless spaces. Reliable supplies.</h2><p>Book trusted cleaning and order professional cleaning supplies across the UAE.</p><button class="btn" onclick="go(\'book\')">Book a cleaning</button><button class="btn ghost" onclick="go(\'quote\')">Request a quote</button></div><h3>Our services</h3><div class="grid">'+SERVICES.map(function(s){return'<div class="card"><b>'+s+'</b></div>'}).join("")+'</div><h3>Why Moji</h3><div class="card">&#10003; Easy online booking<br>&#10003; Time and price confirmed before we start<br>&#10003; Cleaning supplies available with your service</div><div class="card"><b>Contact</b><br>'+(ph?esc(ph):"Contact details coming soon")+(cf("hours")?"<br>"+esc(cf("hours")):"")+'</div><p class="mut" style="text-align:center"><a href="#" onclick="go(\'more\');sb(\'privacy\');return false">Privacy</a> &middot; <a href="#" onclick="go(\'more\');sb(\'terms\');return false">Terms</a><br>&copy; '+bn()+'</p>'}
